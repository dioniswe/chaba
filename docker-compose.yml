
services:

  apache:
    user: "${USER_ID}:${GROUP_ID}"
    container_name: apache
    build:
      context: .
      dockerfile: ./docker/apache/Dockerfile
      args:
        - USER_ID
        - GROUP_ID
    volumes:
      - .:/var/www/chaba
      - ./storage/logs/apache2:/var/log/apache2/
    restart: unless-stopped
    networks:
      - mynet

  # load balancing and security services; had it running once, but skipping for now to ease development
